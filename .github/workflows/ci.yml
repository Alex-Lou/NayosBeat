name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (version in comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The Aseprite extension (Lua), run outside Aseprite against a stand-in for its API.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lua5.4
      - run: npm run aseprite:check
      - run: npm run build
