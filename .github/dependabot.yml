# Weekly update PRs for npm packages and GitHub Actions (including pinned SHAs).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # typescript-eslint (typed lint rules) supports TypeScript < 6.1 only: lift this once it
      # accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
