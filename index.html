<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>NayosBeat</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
      }
      .debug-overlay {
        position: fixed;
        top: 4px;
        left: 4px;
        margin: 0;
        padding: 4px 6px;
        font: 12px/1.3 monospace;
        color: #9f9;
        background: rgba(0, 0, 0, 0.6);
        pointer-events: none;
        z-index: 2;
      }
      .touch-controls {
        position: fixed;
        inset: 0;
        z-index: 1;
        -webkit-touch-callout: none;
      }
      .touch-stick-zone {
        position: absolute;
        inset: 0 50% 0 0;
      }
      .touch-stick-base {
        position: absolute;
        top: 0;
        left: 0;
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.3);
        box-sizing: border-box;
        pointer-events: none;
        visibility: hidden;
      }
      .touch-stick-base.active {
        visibility: visible;
      }
      .touch-stick-knob {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
      }
      .touch-button {
        position: absolute;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 12px sans-serif;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .touch-jump {
        right: calc(20px + env(safe-area-inset-right));
        bottom: calc(20px + env(safe-area-inset-bottom));
      }
      .touch-heavy {
        right: calc(94px + env(safe-area-inset-right));
        bottom: calc(20px + env(safe-area-inset-bottom));
      }
      .touch-light {
        right: calc(168px + env(safe-area-inset-right));
        bottom: calc(20px + env(safe-area-inset-bottom));
      }
      .touch-throw {
        right: calc(57px + env(safe-area-inset-right));
        bottom: calc(94px + env(safe-area-inset-bottom));
        font-size: 10px;
      }
      .touch-special {
        right: calc(131px + env(safe-area-inset-right));
        bottom: calc(94px + env(safe-area-inset-bottom));
      }
      .rotate-hint {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        .rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 3;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          text-align: center;
          font: 18px sans-serif;
          color: #fff;
          background: #000;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="rotate-hint">Tourne ton téléphone en mode paysage</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
