<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>NayosBeat</title>
    <meta name="description" content="Jeu de combat 2D en pixel art." />
    <meta name="theme-color" content="#1b1b2f" />
    <!-- Installable game (PWA): fullscreen, landscape, offline. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NayosBeat" />
    <!-- Startup guard: shows a failure instead of a blank screen (see public/boot.js). -->
    <script src="./boot.js" vite-ignore></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui">
      <div id="boot" class="menu boot">
        <h1 class="title-logo">NAYOSBEAT</h1>
        <p id="boot-status" class="boot-status">Chargement…</p>
        <button id="boot-repair" class="menu-item boot-repair" type="button" hidden>
          Réparer et relancer
        </button>
      </div>
    </div>
    <div class="rotate-hint">Tourne ton téléphone en mode paysage</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
